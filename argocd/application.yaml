apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic
  namespace: argocd
  # Auto-delete K8s resources when this ArgoCD app is deleted
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL:        https://github.com/skssandy/petclinic-k8s-manifests.git
    targetRevision: main
    path:           k8s
  destination:
    server:    https://kubernetes.default.svc
    namespace: petclinic
  syncPolicy:
    automated:
      prune:     true   # delete resources removed from git
      selfHeal:  true   # revert manual kubectl changes
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
